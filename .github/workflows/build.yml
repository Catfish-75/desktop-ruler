name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config qt6-base-dev
      - name: Build
        run: make -j2
      - name: Run offscreen tests
        run: make test
